<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mass Times · St. Columbkille</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:      #F6F1E7;
    --cream-deep: #EFE8D9;
    --surface:    #FFFFFF;
    --surface-2:  #FCFAF4;
    --ink:        #2B2825;
    --ink-soft:   #6E675C;
    --ink-faint:  #A39B8C;
    --line:       #E8E1D1;
    --line-soft:  #F0EADC;
    --gold:       #B0863A;
    --gold-deep:  #8F6B2C;
    --gold-tint:  #F3E9D2;
    --shadow:     0 1px 2px rgba(43,40,37,0.04), 0 8px 24px -12px rgba(43,40,37,0.14);
    --shadow-sheet: 0 -8px 40px -8px rgba(43,40,37,0.22);
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --font-display: "Spectral", Georgia, serif;
    --font-ui: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--cream-deep);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; }

  /* Phone shell — fills viewport on mobile, framed card on desktop */
  #shell {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--cream);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 480px) {
    body { padding: 28px 16px; }
    #shell {
      min-height: calc(100vh - 56px);
      border-radius: 28px;
      box-shadow: 0 2px 4px rgba(43,40,37,0.05), 0 30px 70px -30px rgba(43,40,37,0.35);
      overflow: hidden;
    }
  }

  ::-webkit-scrollbar { width: 0; height: 0; }

  /* utility */
  .row { display: flex; align-items: center; }
  .tnum { font-variant-numeric: tabular-nums; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes sheetIn {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Production React (small, fast) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Schedule data, generated from the parish bulletin PDF by fetch_schedule.py -->
  <script src="data.js"></script>

  <!-- App, pre-compiled from app.jsx by build.sh (no in-browser Babel) -->
  <script src="app.js"></script>
</body>
</html>
